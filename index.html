<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1c6a56">
<meta name="description" content="See where your money goes. Your statements never leave your device.">
<title>Spend It</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 64 64" width="42" height="42" aria-hidden="true">  <g stroke="#0f3d31" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="#ffffff">    <path d="M12 23 C7 17 2 16 1 19 C1 22 3 23 5 23.5 C2 24.5 1.5 27 3 28.5 C4.5 29.5 6.5 29 8 28.5 C6.5 30.5 7 32.5 9 33 C10.5 33.3 11.5 32.5 12 31.5 Z"/>    <path d="M52 23 C57 17 62 16 63 19 C63 22 61 23 59 23.5 C62 24.5 62.5 27 61 28.5 C59.5 29.5 57.5 29 56 28.5 C57.5 30.5 57 32.5 55 33 C53.5 33.3 52.5 32.5 52 31.5 Z"/>  </g>  <g stroke="#0f3d31" stroke-width="2.2" stroke-linejoin="round">    <rect x="10" y="16" width="44" height="31" rx="5" fill="#8fdc93"/>    <rect x="14" y="20" width="36" height="23" rx="3" fill="none" stroke-width="1.3" stroke-dasharray="2 2.2"/>    <circle cx="24.5" cy="28" r="6" fill="#ffffff"/>    <circle cx="39.5" cy="28" r="6" fill="#ffffff"/>  </g>  <circle cx="26.7" cy="30" r="2.6" fill="#0f3d31"/>  <circle cx="37.2" cy="26.2" r="2.6" fill="#0f3d31"/>  <path d="M23.5 36 Q32 44.5 40.5 36 Z" fill="#0f3d31" stroke="#0f3d31" stroke-width="2" stroke-linejoin="round"/>  <path d="M28.6 39.6 Q32 42.4 35.4 39.6 Q32 38 28.6 39.6 Z" fill="#ff7a8a"/>  <text x="16" y="44" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="6" fill="#0f3d31">$</text>  <text x="44" y="24.5" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="6" fill="#0f3d31">$</text></svg></div>
      <h1>Spend It</h1>
      <span class="save-state" id="saveState"><i class="dot"></i><span>Locked</span></span>
    </div>
    <div class="controls">
      <label class="theme-sw" title="Dark mode"><span class="ts-ic" aria-hidden="true">☀️</span><input type="checkbox" id="themeSw" role="switch" aria-label="Dark mode"><span class="ts-track"><span class="ts-knob"></span></span><span class="ts-ic" aria-hidden="true">🌙</span></label>
      <select class="sel" id="rangeSel" aria-label="Date range"></select>
      <select class="sel" id="acctSel" aria-label="Account"></select>
      <button class="btn ghost" id="lockBtn" type="button" hidden aria-label="Lock Spend It"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Lock</button>
      <button class="btn primary" id="addBtn" type="button" hidden><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Add statements</button>
    </div>
  </div>
  <div class="tabs-wrap"><nav class="tabs" role="tablist" id="tabs" hidden>
    <button class="tab" role="tab" data-v="overview">Overview</button>
    <button class="tab" role="tab" data-v="transactions">Transactions<span class="count" id="txCount"></span></button>
    <button class="tab" role="tab" data-v="recurring">Recurring</button>
    <button class="tab" role="tab" data-v="budgets">Budgets</button>
    <button class="tab" role="tab" data-v="statements">Statements<span class="count" id="stCount"></span></button>
  </nav></div>
</header>
<main id="main"></main>
<input type="file" id="impIn" accept=".json,application/json" hidden>
<input type="file" id="fileIn" multiple accept=".pdf,.csv,.xlsx,.xls,.txt,application/pdf,text/csv" hidden>
<div class="tip" id="tip" role="tooltip"></div>
</body>
</html>
